<!-- prettier-ignore -->
{% extends "base.html" %} {% url 'food_diary' as home_url %}
<!-- prettier-ignore -->
{% block title%}Diary Login{% endblock %} {% block content %}
<div class="auth-page d-flex align-items-center justify-content-center">
    <div class="auth-card card-lite">
        <h2 class="h4 mb-3 text-center">Sign in</h2>
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="id_username" class="visually-hidden"
                    >Username</label
                >
                <input
                    id="id_username"
                    name="username"
                    type="text"
                    class="form-control"
                    placeholder="Username"
                    required
                />
            </div>

            <div class="form-group mb-3">
                <label for="id_password" class="visually-hidden"
                    >Password</label
                >
                <input
                    id="id_password"
                    name="password"
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    required
                />
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="small" href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>

            <p class="text-center small mt-3">
                New here? <a href="#">Register</a>
            </p>
        </form>
    </div>
</div>
{% endblock %} {% block extra_scripts %}
<script
    type="module"
    src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
></script>
<script
    nomodule
    src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
></script>
{% endblock %}
