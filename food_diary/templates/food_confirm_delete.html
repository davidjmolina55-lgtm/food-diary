{% extends "base.html" %} {% block title %}Confirm Delete{% endblock %} {% block
content %}
<div class="card-lite">
    <h1 class="h5 mb-3">Delete Food</h1>
    <p>Are you sure you want to delete "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a class="btn btn-secondary" href="{% url 'food_list' %}">Cancel</a>
    </form>
</div>

{% endblock %}
